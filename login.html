<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión - Barbería</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">

    <style>
        :root {
            --primary: #1e293b;
            --bg: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #334155;
        }

        .login-card {
            background: white;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
        }

        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            width: 100%;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0f172a;
        }

        .error-msg {
            color: #dc2626;
            background: #fee2e2;
            border: 1px solid #fecdd3;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>✂️ Acceso Barbería</h2>

    <form id="loginForm" onsubmit="iniciarSesion(event)">
        <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@barberia.com" required>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnIngresar">Ingresar</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        getAuth, signInWithEmailAndPassword, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDr2WkcTIkK65JAnbY1F9kRmesUgFYezW4",
        authDomain: "barberiacontrol-c7731.firebaseapp.com",
        projectId: "barberiacontrol-c7731",
        storageBucket: "barberiacontrol-c7731.firebasestorage.app",
        messagingSenderId: "411795215845",
        appId: "1:411795215845:web:9b6a58289e8b4614f8cb0c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Si ya hay una sesión activa, entra directo a la app
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "index.html";
        }
    });

    window.iniciarSesion = async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btnIngresar');
        const errDiv = document.getElementById('errorMsg');

        btn.innerText = "Verificando...";
        btn.disabled = true;
        errDiv.style.display = "none";

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "index.html";
        } catch (error) {
            btn.innerText = "Ingresar";
            btn.disabled = false;
            errDiv.style.display = "block";

            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                errDiv.innerText = "Usuario o contraseña incorrectos.";
            } else if (error.code === 'auth/too-many-requests') {
                errDiv.innerText = "Demasiados intentos fallidos. Intente más tarde.";
            } else {
                errDiv.innerText = "Error al iniciar sesión: " + error.message;
            }
        }
    };
</script>

</body>
</html>
