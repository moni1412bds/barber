<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barbería - Panel Barbero</title>

    <!-- Configuración PWA y Auto-Update para Android/iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barbería App">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Evitar caché desactualizado en celulares -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>

    <style>
        :root {
            --primary: #1e293b;
            --bg: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #334155;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .header { flex-direction: row; justify-content: space-between; align-items: center; }
            body { padding: 15px; }
            .container { padding: 20px; }
        }

        h1 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        .date-badge { background: #e2e8f0; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; align-self: flex-start; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .card {
            padding: 12px;
            border-radius: 10px;
            color: white;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            background-color: #3b82f6;
        }

        .card-total { background-color: #1e293b; }
        .card h3 { margin: 0 0 6px 0; font-size: 1rem; text-transform: capitalize; }
        .card .amount { font-size: 1.3rem; font-weight: bold; }
        .card .subtext { font-size: 0.78rem; opacity: 0.95; margin-top: 4px; line-height: 1.3; }

        .input-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
        label { font-weight: 600; font-size: 0.8rem; }

        select, input, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            min-width: 150px;
            user-select: none;
        }

        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { cursor: pointer; font-size: 0.85rem; margin: 0; }

        button.btn-primary { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button.btn-config { background-color: #475569; color: white; border: none; cursor: pointer; font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 10px; text-align: center; font-size: 0.85rem; white-space: nowrap; }
        th { background-color: #f8fafc; font-weight: bold; }

        .status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .badge-pago { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-efectivo { background: #dcfce7; color: #166534; }
        .badge-transf { background: #e0f2fe; color: #075985; }
        .badge-gasto { background: #fee2e2; color: #991b1b; }

        .modal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999;
        }
        .modal-content { position: relative; background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
        .btn-modal-close-x {
            position: absolute; top: 12px; right: 12px; background: #ef4444; color: white; border: none;
            width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✂️️ Panel de Registro - Barbero</h1>
        <div class="date-badge" id="fechaHoy">--/--/----</div>
    </div>

    <!-- BARRA DE ESTADO -->
    <div class="status-bar">
        <div style="font-size: 0.85rem;">
            🔥 <strong id="statusText">Conectando a Firebase...</strong>
        </div>
        <div style="display:flex; gap:6px;">
            <button class="btn-config" onclick="abrirModalGastos()">💸 Retiro/Gasto</button>
            <button class="btn-config" style="background:#dc2626;" onclick="cerrarSesion()">🚪 Salir</button>
        </div>
    </div>

    <!-- TARJETAS DE RESUMEN DIARIO -->
    <div class="cards-grid" id="cardsBarberosGrid"></div>

    <!-- REGISTRO DE TRABAJO -->
    <div class="input-section">
        <div class="input-group">
            <label for="peluquero">Peluquero</label>
            <select id="peluquero"></select>
        </div>
        <div class="input-group">
            <label for="monto">Monto ($)</label>
            <input type="number" id="monto" value="10000" step="1000">
        </div>
        <div class="checkbox-group" onclick="document.getElementById('esTransferencia').click(); event.stopPropagation();">
            <input type="checkbox" id="esTransferencia" onclick="event.stopPropagation();">
            <label for="esTransferencia">💳 Transferencia</label>
        </div>
        <div class="input-group">
            <button class="btn-primary" id="btnAgregar" onclick="agregarCorte()">+ Registrar Corte</button>
        </div>
    </div>

    <h3 style="margin-top:20px; font-size:1.1rem;">Cortes Registrados Hoy</h3>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Concepto / Peluquero</th>
                    <th>Medio</th>
                    <th>Monto Corte</th>
                    <th>Pago Barbero</th>
                </tr>
            </thead>
            <tbody id="tablaRegistrosDiarios"></tbody>
        </table>
    </div>
</div>

<!-- MODAL PARA REGISTRO DE GASTOS / RETIROS -->
<div class="modal-bg" id="modalGastos">
    <div class="modal-content">
        <button class="btn-modal-close-x" onclick="cerrarModalGastos()">✕</button>
        <h3 style="margin-top:0; color:#991b1b;">💸 Registrar Gasto / Retiro</h3>

        <div style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="gastoDetalle" placeholder="Detalle (Insumos, Retiro, Limpieza)...">
            <input type="number" id="gastoMonto" placeholder="Monto ($)" step="500">
            <div class="checkbox-group" style="padding: 8px 12px; background:white;" onclick="document.getElementById('gastoEsTransferencia').click(); event.stopPropagation();">
                <input type="checkbox" id="gastoEsTransferencia" onclick="event.stopPropagation();">
                <label for="gastoEsTransferencia">💳 Salida por Transferencia</label>
            </div>
            <button class="btn-primary" style="background:#dc2626;" onclick="registrarGastoCaja()">- Guardar Retiro</button>
        </div>
    </div>
</div>

<!-- FIREBASE SDKs & LOGIC -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        getAuth, onAuthStateChanged, signOut 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { 
        getFirestore, collection, addDoc, onSnapshot, doc, setDoc, enableIndexedDbPersistence 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDr2WkcTIkK65JAnbY1F9kRmesUgFYezW4",
        authDomain: "barberiacontrol-c7731.firebaseapp.com",
        projectId: "barberiacontrol-c7731",
        storageBucket: "barberiacontrol-c7731.firebasestorage.app",
        messagingSenderId: "411795215845",
        appId: "1:411795215845:web:9b6a58289e8b4614f8cb0c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // MODO OFFLINE
    enableIndexedDbPersistence(db).catch(() => {});

    // COMPROBAR SESIÓN
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        document.getElementById('statusText').innerText = `Sesión: ${user.email}`;
    });

    window.cerrarSesion = function() {
        signOut(auth).then(() => window.location.href = "login.html");
    };

    window.listaBarberos = ['riki', 'lucas', 'willy'];
    window.registrosHoy = [];
    const coloresBarberos = ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

    document.getElementById('fechaHoy').innerText = new Date().toLocaleDateString('es-AR', {
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });

    // LISTENERS FIRESTORE
    onSnapshot(doc(db, "configuracion", "barberos"), (docSnap) => {
        if (docSnap.exists() && docSnap.data().lista) {
            window.listaBarberos = docSnap.data().lista;
        } else {
            setDoc(doc(db, "configuracion", "barberos"), { lista: window.listaBarberos });
        }
        actualizarSelectoresBarberos();
        actualizarInterfazDiaria();
    });

    onSnapshot(collection(db, "cortesHoy"), (snapshot) => {
        window.registrosHoy = [];
        snapshot.forEach((doc) => {
            window.registrosHoy.push({ id: doc.id, ...doc.data() });
        });
        actualizarInterfazDiaria();
    });

    window.actualizarSelectoresBarberos = function() {
        const select = document.getElementById('peluquero');
        if (!select) return;
        select.innerHTML = '';
        window.listaBarberos.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b.toLowerCase();
            opt.textContent = b.charAt(0).toUpperCase() + b.slice(1);
            select.appendChild(opt);
        });
    };

    window.agregarCorte = async function() {
        const peluquero = document.getElementById('peluquero').value;
        const monto = parseFloat(document.getElementById('monto').value);
        const esTransferencia = document.getElementById('esTransferencia').checked;

        if (isNaN(monto) || monto <= 0) {
            alert('Ingrese un monto válido');
            return;
        }

        const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        await addDoc(collection(db, "cortesHoy"), {
            tipo: 'corte',
            peluquero: peluquero,
            monto: monto,
            hora: hora,
            metodo: esTransferencia ? 'transferencia' : 'efectivo',
            timestamp: Date.now()
        });

        document.getElementById('esTransferencia').checked = false;
    };

    window.registrarGastoCaja = async function() {
        const detalle = document.getElementById('gastoDetalle').value.trim();
        const monto = parseFloat(document.getElementById('gastoMonto').value);
        const esTransferencia = document.getElementById('gastoEsTransferencia').checked;

        if (!detalle || isNaN(monto) || monto <= 0) {
            alert('Ingrese detalle y monto válidos');
            return;
        }

        const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        await addDoc(collection(db, "cortesHoy"), {
            tipo: 'gasto',
            detalle: detalle,
            monto: monto,
            hora: hora,
            metodo: esTransferencia ? 'transferencia' : 'efectivo',
            timestamp: Date.now()
        });

        document.getElementById('gastoDetalle').value = '';
        document.getElementById('gastoMonto').value = '';
        document.getElementById('gastoEsTransferencia').checked = false;
        cerrarModalGastos();
    };

    window.actualizarInterfazDiaria = function() {
        const grid = document.getElementById('cardsBarberosGrid');
        if (!grid) return;

        const cortes = window.registrosHoy.filter(r => r.tipo !== 'gasto');
        const totalCortesCount = cortes.length;
        const totalRecaudadoCortes = cortes.reduce((acc, curr) => acc + curr.monto, 0);

        let htmlCards = `
            <div class="card card-total">
                <h3>Cortes de Hoy</h3>
                <div class="amount">${totalCortesCount}</div>
                <div class="subtext">Recaudado total: $${totalRecaudadoCortes.toLocaleString()}</div>
            </div>
        `;

        window.listaBarberos.forEach((barbero, idx) => {
            const bKey = barbero.toLowerCase();
            const cortesB = cortes.filter(r => r.peluquero && r.peluquero.toLowerCase() === bKey);
            const totB = cortesB.reduce((a, b) => a + b.monto, 0);
            const color = coloresBarberos[idx % coloresBarberos.length];

            htmlCards += `
                <div class="card" style="background-color: ${color}">
                    <h3>${barbero}</h3>
                    <div class="amount">$${(totB * 0.5).toLocaleString()}</div>
                    <div class="subtext">${cortesB.length} cortes realizados</div>
                </div>
            `;
        });

        grid.innerHTML = htmlCards;

        const tbody = document.getElementById('tablaRegistrosDiarios');
        tbody.innerHTML = '';

        window.registrosHoy.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

        window.registrosHoy.forEach((reg) => {
            const esGasto = (reg.tipo === 'gasto');
            const metodo = reg.metodo || 'efectivo';
            const tr = document.createElement('tr');

            if (esGasto) {
                tr.innerHTML = `
                    <td><strong>${reg.hora}</strong></td>
                    <td style="color:#dc2626; font-weight:bold;">💸 GASTO: ${reg.detalle}</td>
                    <td><span class="badge-pago badge-gasto">${metodo === 'transferencia' ? '💳 Transf.' : '💵 Efec.'}</span></td>
                    <td style="color:#dc2626; font-weight:bold;">-$${reg.monto.toLocaleString()}</td>
                    <td><em style="color:#94a3b8;">Retiro Caja</em></td>
                `;
            } else {
                tr.innerHTML = `
                    <td><strong>${reg.hora}</strong></td>
                    <td style="text-transform: capitalize;">${reg.peluquero}</td>
                    <td><span class="badge-pago ${metodo === 'transferencia' ? 'badge-transf' : 'badge-efectivo'}">${metodo === 'transferencia' ? '💳 Transf.' : '💵 Efec.'}</span></td>
                    <td>$${reg.monto.toLocaleString()}</td>
                    <td>$${(reg.monto * 0.5).toLocaleString()}</td>
                `;
            }
            tbody.appendChild(tr);
        });
    };

    window.abrirModalGastos = () => document.getElementById('modalGastos').style.display = 'flex';
    window.cerrarModalGastos = () => document.getElementById('modalGastos').style.display = 'none';
</script>
</body>
</html>
