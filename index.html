<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Barbería - Firebase Realtime</title>
    <style>
        :root {
            --primary: #1e293b;
            --bg: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #334155;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .header { flex-direction: row; justify-content: space-between; align-items: center; }
            body { padding: 15px; }
            .container { padding: 20px; }
        }

        h1 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        .date-badge { background: #e2e8f0; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; align-self: flex-start; }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: #e2e8f0;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #64748b;
            transition: 0.2s;
            font-size: 0.85rem;
            text-align: center;
        }

        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .card {
            padding: 12px;
            border-radius: 10px;
            color: white;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            background-color: #3b82f6;
        }

        .card-total { background-color: #1e293b; }
        .card h3 { margin: 0 0 6px 0; font-size: 1rem; text-transform: capitalize; }
        .card .amount { font-size: 1.3rem; font-weight: bold; }
        .card .subtext { font-size: 0.78rem; opacity: 0.95; margin-top: 4px; line-height: 1.3; }

        .input-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
        label { font-weight: 600; font-size: 0.8rem; }

        select, input, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            min-width: 150px;
            user-select: none;
        }

        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { cursor: pointer; font-size: 0.85rem; margin: 0; }

        button.btn-primary { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button.btn-close-day { background-color: #ef4444; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; width: auto; }
        button.btn-config { background-color: #475569; color: white; border: none; cursor: pointer; font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 550px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 10px; text-align: center; font-size: 0.85rem; white-space: nowrap; }
        th { background-color: #f8fafc; font-weight: bold; }

        .action-buttons { display: flex; justify-content: center; align-items: center; gap: 4px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .btn-edit { background: #f59e0b; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

        .status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .badge-pago { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-efectivo { background: #dcfce7; color: #166534; }
        .badge-transf { background: #e0f2fe; color: #075985; }

        .balance-box { background: #1e293b; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
        .balance-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; text-align: center; }
        .balance-item h4 { margin: 0 0 4px 0; font-size: 0.8rem; opacity: 0.8; font-weight: normal; text-transform: capitalize; }
        .balance-item .val { font-size: 1.1rem; font-weight: bold; }

        .modal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999;
        }
        .modal-content { position: relative; background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 480px; }
        .btn-modal-close-x { position: absolute; top: 12px; right: 12px; background: #ef4444; color: white; border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .barber-item-edit { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }

        @media print {
            .status-bar, .tabs, .input-section, .btn-close-day, .btn-delete, .btn-edit, .btn-config { display: none !important; }
            .container { box-shadow: none; padding: 0; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✂️ Barbería - Control de Caja</span></h1>
        <div class="date-badge" id="fechaHoy">--/--/----</div>
    </div>

    <!-- BARRA DE ESTADO -->
    <div class="status-bar">
        <div style="font-size: 0.85rem;">
            🔥 <strong id="statusText">Conectando a Firebase...</strong>
        </div>
        <div>
            <button class="btn-config" onclick="abrirModalBarberos()">⚙️ Opciones</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('diario')">📆 Registro Diario</button>
        <button class="tab-btn" onclick="switchTab('historial')">📊 Historial Cierres</button>
    </div>

    <!-- PESTAÑA 1: REGISTRO DIARIO -->
    <div id="tab-diario" class="tab-content active">
        <div class="cards-grid" id="cardsBarberosGrid"></div>

        <div class="input-section">
            <div class="input-group">
                <label for="peluquero">Peluquero</label>
                <select id="peluquero"></select>
            </div>
            <div class="input-group">
                <label for="monto">Monto ($)</label>
                <input type="number" id="monto" value="10000" step="1000">
            </div>
            <div class="checkbox-group" onclick="document.getElementById('esTransferencia').click(); event.stopPropagation();">
                <input type="checkbox" id="esTransferencia" onclick="event.stopPropagation();">
                <label for="esTransferencia">💳 Transferencia</label>
            </div>
            <div class="input-group">
                <button class="btn-primary" id="btnAgregar" onclick="agregarOEditarCorte()">+ Registrar Corte</button>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; flex-wrap:wrap; gap:10px;">
            <h3 style="margin:0; font-size:1.1rem;">Cortes del Día</h3>
            <button class="btn-close-day" onclick="cierreDeCaja()">🔒 Realizar Cierre Diario</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Peluquero</th>
                        <th>Medio</th>
                        <th>Monto Corte</th>
                        <th>Pago Barbero</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRegistrosDiarios"></tbody>
            </table>
        </div>
    </div>

    <!-- PESTAÑA 2: HISTORIAL Y RESUMEN -->
    <div id="tab-historial" class="tab-content">
        <div class="input-section" style="margin-bottom: 10px;">
            <div class="input-group">
                <label>Filtro Rápido</label>
                <select id="filtroTiempo" onchange="limpiarFechasManuales(); renderHistorial();">
                    <option value="semanal">Últimos 7 Días (Semanal)</option>
                    <option value="mensual">Último Mes (30 Días)</option>
                    <option value="todo">Histórico Completo</option>
                    <option value="personalizado">Rango Personalizado 📅</option>
                </select>
            </div>
            <div class="input-group">
                <label for="fechaDesde">Desde</label>
                <input type="date" id="fechaDesde" onchange="activarPersonalizado()">
            </div>
            <div class="input-group">
                <label for="fechaHasta">Hasta</label>
                <input type="date" id="fechaHasta" onchange="activarPersonalizado()">
            </div>
            <div class="input-group" style="min-width: 100px;">
                <label>&nbsp;</label>
                <button class="btn-primary" style="background:#0284c7;" onclick="renderHistorial()">🔍 Calcular</button>
            </div>
            <div class="input-group" style="min-width: 100px;">
                <label>&nbsp;</label>
                <button class="btn-primary" style="background:#475569;" onclick="window.print()">🖨️ Imprimir</button>
            </div>
        </div>

        <div class="balance-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; font-size:1.05rem;">📊 Balance del Período</h3>
                <span id="txtRangoFechas" style="font-size:0.8rem; opacity:0.8;">--</span>
            </div>
            <div class="balance-grid" id="balanceGrid"></div>
        </div>

        <div class="table-responsive">
            <table>
                <thead id="headHistorial"></thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL CONFIGURACIÓN -->
<div class="modal-bg" id="modalBarberos">
    <div class="modal-content">
        <button class="btn-modal-close-x" onclick="cerrarModalBarberos()">✕</button>
        <h3 style="margin-top:0;">⚙️ Configurar Barberos</h3>
        <p style="font-size:0.85rem; color:#64748b;">Añade o elimina miembros del equipo:</p>
        
        <div id="listaBarberosEdit" style="max-height:180px; overflow-y:auto; margin-bottom:15px;"></div>

        <div style="display:flex; gap:6px; margin-bottom:15px;">
            <input type="text" id="nuevoBarberoNombre" placeholder="Nombre nuevo barbero...">
            <button class="btn-primary" style="width:auto;" onclick="agregarBarberoNuevo()">+ Añadir</button>
        </div>

        <!-- SECCIÓN DE CÓPIA DE SEGURIDAD / IMPORTACIÓN -->
        <div style="margin-top:15px; padding-top:10px; border-top:1px dashed #cbd5e1;">
            <h4 style="margin:0 0 8px 0; font-size:0.9rem;">📥 Importar Copia de Seguridad (.json)</h4>
            <input type="file" id="inputBackupJson" accept=".json" style="font-size:0.8rem; margin-bottom:8px;">
            <button class="btn-primary" style="background:#0284c7; font-size:0.85rem;" onclick="importarBackupJSON()">Subir Historial a Firebase</button>
        </div>

        <div style="margin-top:15px; padding-top:10px; border-top:1px dashed #ef4444;">
            <button class="btn-primary" style="background:#dc2626; font-size:0.8rem; width:100%;" onclick="forzarLimpiezaDiaria()">🚨 Forzar Limpieza Diaria ($0)</button>
        </div>

        <div style="text-align:right; margin-top:20px;">
            <button onclick="cerrarModalBarberos()" class="btn-primary" style="width:auto; background:#1e293b;">Guardar y Cerrar</button>
        </div>
    </div>
</div>

<!-- FIREBASE SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, setDoc, getDocs, writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // 🔴 TUS CREDENCIALES DE FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDr2WkcTIkK65JAnbY1F9kRmesUgFYezW4",
        authDomain: "barberiacontrol-c7731.firebaseapp.com",
        projectId: "barberiacontrol-c7731",
        storageBucket: "barberiacontrol-c7731.firebasestorage.app",
        messagingSenderId: "411795215845",
        appId: "1:411795215845:web:9b6a58289e8b4614f8cb0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables de Estado
    window.listaBarberos = ['riki', 'lucas', 'willy'];
    window.registrosHoy = [];
    window.historialCierres = [];
    window.idEditando = null;
    const coloresBarberos = ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

    // Inicializar Fecha Visual
    document.getElementById('fechaHoy').innerText = new Date().toLocaleDateString('es-AR', {
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });

    // 📡 ESCUCHADORES EN TIEMPO REAL
    
    // 1. Escuchar Barberos
    onSnapshot(doc(db, "configuracion", "barberos"), (docSnap) => {
        if (docSnap.exists() && docSnap.data().lista) {
            window.listaBarberos = docSnap.data().lista;
        } else {
            setDoc(doc(db, "configuracion", "barberos"), { lista: window.listaBarberos });
        }
        actualizarSelectoresBarberos();
        actualizarInterfazDiaria();
    });

    // 2. Escuchar Cortes de Hoy
    onSnapshot(collection(db, "cortesHoy"), (snapshot) => {
        window.registrosHoy = [];
        snapshot.forEach((doc) => {
            window.registrosHoy.push({ id: doc.id, ...doc.data() });
        });
        document.getElementById('statusText').innerText = "Conectado a Firebase ✅";
        actualizarInterfazDiaria();
    });

    // 3. Escuchar Historial de Cierres
    onSnapshot(collection(db, "historialCierres"), (snapshot) => {
        window.historialCierres = [];
        snapshot.forEach((doc) => {
            window.historialCierres.push({ id: doc.id, ...doc.data() });
        });
        if (document.getElementById('tab-historial').classList.contains('active')) {
            renderHistorial();
        }
    });

    // --- FUNCION DE IMPORTACIÓN DE BACKUP ---
    window.importarBackupJSON = function() {
        const fileInput = document.getElementById('inputBackupJson');
        if (!fileInput.files.length) {
            alert('Por favor, selecciona un archivo .json de respaldo.');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                let listaCierres = [];

                // Si viene estructurado como objeto completo o como arreglo directo
                if (Array.isArray(data)) {
                    listaCierres = data;
                } else if (data.historialCierres && Array.isArray(data.historialCierres)) {
                    listaCierres = data.historialCierres;
                } else if (typeof data === 'object') {
                    // Si JSONBin guardó una estructura directa
                    listaCierres = data.historialCierres || data.historial || [];
                }

                if (listaCierres.length === 0) {
                    alert('No se encontraron registros de cierres válidos en el archivo JSON.');
                    return;
                }

                if (confirm(`Se van a importar ${listaCierres.length} cierres de caja a Firebase. ¿Continuar?`)) {
                    let importados = 0;
                    for (const cierre of listaCierres) {
                        // Limpiar ID local si existe para dejar que Firestore genere una clave limpia
                        const itemParaSubir = { ...cierre };
                        delete itemParaSubir.id;

                        await addDoc(collection(db, "historialCierres"), itemParaSubir);
                        importados++;
                    }
                    alert(`✅ ¡Se importaron exitosamente ${importados} cierres a Firebase!`);
                    cerrarModalBarberos();
                }
            } catch (err) {
                alert('Error al procesar el archivo JSON: ' + err.message);
            }
        };

        reader.readAsText(file);
    };

    // --- FUNCIONES GLOBALES ---

    window.actualizarSelectoresBarberos = function() {
        const select = document.getElementById('peluquero');
        if (!select) return;
        select.innerHTML = '';
        window.listaBarberos.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b.toLowerCase();
            opt.textContent = b.charAt(0).toUpperCase() + b.slice(1);
            select.appendChild(opt);
        });
    };

    window.agregarOEditarCorte = async function() {
        const peluquero = document.getElementById('peluquero').value;
        const monto = parseFloat(document.getElementById('monto').value);
        const esTransferencia = document.getElementById('esTransferencia').checked;

        if (isNaN(monto) || monto <= 0) {
            alert('Ingrese un monto válido');
            return;
        }

        if (window.idEditando) {
            await updateDoc(doc(db, "cortesHoy", window.idEditando), {
                peluquero: peluquero,
                monto: monto,
                metodo: esTransferencia ? 'transferencia' : 'efectivo'
            });
            window.idEditando = null;
            document.getElementById('btnAgregar').innerText = '+ Registrar Corte';
            document.getElementById('btnAgregar').style.background = 'var(--primary)';
        } else {
            const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            await addDoc(collection(db, "cortesHoy"), {
                peluquero: peluquero,
                monto: monto,
                hora: hora,
                metodo: esTransferencia ? 'transferencia' : 'efectivo',
                timestamp: Date.now()
            });
        }
        document.getElementById('esTransferencia').checked = false;
    };

    window.editarCorte = function(id) {
        const reg = window.registrosHoy.find(r => r.id === id);
        if (!reg) return;
        document.getElementById('peluquero').value = reg.peluquero;
        document.getElementById('monto').value = reg.monto;
        document.getElementById('esTransferencia').checked = (reg.metodo === 'transferencia');

        window.idEditando = id;
        document.getElementById('btnAgregar').innerText = '✏️ Guardar Cambios';
        document.getElementById('btnAgregar').style.background = '#f59e0b';
    };

    window.eliminarCorte = async function(id) {
        await deleteDoc(doc(db, "cortesHoy", id));
    };

    window.eliminarCierre = async function(idDoc) {
        if (confirm('¿Eliminar definitivamente este cierre del historial?')) {
            await deleteDoc(doc(db, "historialCierres", idDoc));
        }
    };

    window.cierreDeCaja = async function() {
        if (window.registrosHoy.length === 0) {
            alert('No hay registros cargados para realizar el cierre.');
            return;
        }

        const fechaSugerida = new Date().toISOString().split('T')[0];
        const fechaIngresada = prompt("Confirma la FECHA para este cierre (AAAA-MM-DD):", fechaSugerida);
        if (!fechaIngresada) return;

        const detalleBarberos = {};
        window.listaBarberos.forEach(b => { detalleBarberos[b.toLowerCase()] = 0; });

        let efTotal = 0;
        let trTotal = 0;

        window.registrosHoy.forEach(r => {
            const m = r.metodo || 'efectivo';
            if (m === 'transferencia') trTotal += r.monto;
            else efTotal += r.monto;

            const bKey = r.peluquero.toLowerCase();
            if (detalleBarberos[bKey] !== undefined) {
                detalleBarberos[bKey] += (r.monto * 0.5);
            }
        });

        const partesFecha = fechaIngresada.split('-');
        const anio = parseInt(partesFecha[0], 10);
        const mes = parseInt(partesFecha[1], 10) - 1;
        const dia = parseInt(partesFecha[2], 10);

        const fechaFormateada = `${dia.toString().padStart(2, '0')}/${(mes + 1).toString().padStart(2, '0')}/${anio}`;
        const timestampLocal = new Date(anio, mes, dia, 12, 0, 0).getTime();

        await addDoc(collection(db, "historialCierres"), {
            fecha: fechaIngresada,
            fechaTexto: fechaFormateada,
            timestamp: timestampLocal,
            cortesTotales: window.registrosHoy.length,
            recaudacionTotal: efTotal + trTotal,
            efectivoTotal: efTotal,
            transferenciaTotal: trTotal,
            pagosBarberos: detalleBarberos
        });

        const batch = writeBatch(db);
        const snapshot = await getDocs(collection(db, "cortesHoy"));
        snapshot.forEach((doc) => { batch.delete(doc.ref); });
        await batch.commit();

        alert('✅ Cierre de caja realizado con éxito.');
    };

    window.forzarLimpiezaDiaria = async function() {
        if (confirm('🚨 ¿Deseas resetear la caja de hoy a $0 en todos los dispositivos?')) {
            const batch = writeBatch(db);
            const snapshot = await getDocs(collection(db, "cortesHoy"));
            snapshot.forEach((doc) => { batch.delete(doc.ref); });
            await batch.commit();
            cerrarModalBarberos();
        }
    };

    window.actualizarInterfazDiaria = function() {
        const grid = document.getElementById('cardsBarberosGrid');
        if (!grid) return;

        const totalCortes = window.registrosHoy.length;
        const totalRecaudado = window.registrosHoy.reduce((acc, curr) => acc + curr.monto, 0);
        const totalEf = window.registrosHoy.filter(r => (r.metodo || 'efectivo') === 'efectivo').reduce((acc, curr) => acc + curr.monto, 0);
        const totalTr = window.registrosHoy.filter(r => r.metodo === 'transferencia').reduce((acc, curr) => acc + curr.monto, 0);
        const ticketPromedio = totalCortes > 0 ? Math.round(totalRecaudado / totalCortes) : 0;

        let htmlCards = `
            <div class="card card-total">
                <h3>Total Hoy</h3>
                <div class="amount">$${totalRecaudado.toLocaleString()}</div>
                <div class="subtext">${totalCortes} cortes | Prom: $${ticketPromedio.toLocaleString()}<br>Ef: $${totalEf.toLocaleString()} | Tr: $${totalTr.toLocaleString()}</div>
            </div>
        `;

        window.listaBarberos.forEach((barbero, idx) => {
            const bKey = barbero.toLowerCase();
            const cortesB = window.registrosHoy.filter(r => r.peluquero.toLowerCase() === bKey);
            const efB = cortesB.filter(r => (r.metodo || 'efectivo') === 'efectivo').reduce((a, b) => a + b.monto, 0);
            const trB = cortesB.filter(r => r.metodo === 'transferencia').reduce((a, b) => a + b.monto, 0);
            const totB = efB + trB;
            const color = coloresBarberos[idx % coloresBarberos.length];

            htmlCards += `
                <div class="card" style="background-color: ${color}">
                    <h3>${barbero}</h3>
                    <div class="amount">$${(totB * 0.5).toLocaleString()}</div>
                    <div class="subtext">${cortesB.length} cortes<br>Ef: $${(efB * 0.5).toLocaleString()} | Tr: $${(trB * 0.5).toLocaleString()}</div>
                </div>
            `;
        });

        grid.innerHTML = htmlCards;

        const tbody = document.getElementById('tablaRegistrosDiarios');
        tbody.innerHTML = '';

        window.registrosHoy.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

        window.registrosHoy.forEach((reg) => {
            const metodo = reg.metodo || 'efectivo';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${reg.hora}</strong></td>
                <td style="text-transform: capitalize;">${reg.peluquero}</td>
                <td><span class="badge-pago ${metodo === 'transferencia' ? 'badge-transf' : 'badge-efectivo'}">${metodo === 'transferencia' ? '💳 Transf.' : '💵 Efec.'}</span></td>
                <td>$${reg.monto.toLocaleString()}</td>
                <td>$${(reg.monto * 0.5).toLocaleString()}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="editarCorte('${reg.id}')">✏️</button>
                        <button class="btn-delete" onclick="eliminarCorte('${reg.id}')">✕</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    };

    window.renderHistorial = function() {
        const filtro = document.getElementById('filtroTiempo').value;
        const tbody = document.getElementById('tablaHistorial');
        const head = document.getElementById('headHistorial');
        tbody.innerHTML = '';

        let headHTML = `
            <tr>
                <th>Fecha Cierre</th>
                <th>Cortes</th>
                <th>Total General</th>
                <th>Efectivo</th>
                <th>Transferencias</th>
        `;
        window.listaBarberos.forEach(b => { headHTML += `<th style="text-transform:capitalize;">${b}</th>`; });
        headHTML += `<th>Acción</th></tr>`;
        head.innerHTML = headHTML;

        const ahora = new Date().getTime();
        let limiteMs = 0;
        const fechaDesdeVal = document.getElementById('fechaDesde').value;
        const fechaHastaVal = document.getElementById('fechaHasta').value;

        const filtrados = window.historialCierres.filter(c => {
            if (!c.fecha) return false;
            const pC = c.fecha.split('-');
            const cFecha = new Date(parseInt(pC[0]), parseInt(pC[1]) - 1, parseInt(pC[2]), 0, 0, 0).getTime();

            if (filtro === 'personalizado' && (fechaDesdeVal || fechaHastaVal)) {
                let fDesde = 0;
                let fHasta = Infinity;
                if (fechaDesdeVal) {
                    const pD = fechaDesdeVal.split('-');
                    fDesde = new Date(parseInt(pD[0]), parseInt(pD[1]) - 1, parseInt(pD[2]), 0, 0, 0).getTime();
                }
                if (fechaHastaVal) {
                    const pH = fechaHastaVal.split('-');
                    fHasta = new Date(parseInt(pH[0]), parseInt(pH[1]) - 1, parseInt(pH[2]), 23, 59, 59).getTime();
                }
                return cFecha >= fDesde && cFecha <= fHasta;
            }

            if (filtro === 'semanal') limiteMs = 7 * 24 * 60 * 60 * 1000;
            else if (filtro === 'mensual') limiteMs = 30 * 24 * 60 * 60 * 1000;
            else if (filtro === 'todo') return true;

            return (ahora - cFecha) <= limiteMs;
        });

        filtrados.sort((a, b) => b.timestamp - a.timestamp);

        let balRecaudado = 0, balCortes = 0, balEf = 0, balTr = 0;
        const balBarberos = {};
        window.listaBarberos.forEach(b => { balBarberos[b.toLowerCase()] = 0; });

        filtrados.forEach(c => {
            balRecaudado += (c.recaudacionTotal || 0);
            balCortes += (c.cortesTotales || 0);
            balEf += (c.efectivoTotal || 0);
            balTr += (c.transferenciaTotal || 0);

            let rowBarberosHTML = '';
            window.listaBarberos.forEach(b => {
                const bKey = b.toLowerCase();
                const val = (c.pagosBarberos && c.pagosBarberos[bKey] !== undefined) ? c.pagosBarberos[bKey] : 0;
                balBarberos[bKey] += val;
                rowBarberosHTML += `<td>$${val.toLocaleString()}</td>`;
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${c.fechaTexto}</strong></td>
                <td>${c.cortesTotales}</td>
                <td><strong>$${c.recaudacionTotal.toLocaleString()}</strong></td>
                <td>$${(c.efectivoTotal || 0).toLocaleString()}</td>
                <td>$${(c.transferenciaTotal || 0).toLocaleString()}</td>
                ${rowBarberosHTML}
                <td><button class="btn-delete" onclick="eliminarCierre('${c.id}')">✕ Borrar</button></td>
            `;
            tbody.appendChild(tr);
        });

        const balGrid = document.getElementById('balanceGrid');
        balGrid.innerHTML = `
            <div class="balance-item">
                <h4>Total Recaudado</h4>
                <div class="val" style="color:#38bdf8;">$${balRecaudado.toLocaleString()}</div>
            </div>
            <div class="balance-item">
                <h4>Cortes Totales</h4>
                <div class="val">${balCortes}</div>
            </div>
            <div class="balance-item">
                <h4>Efectivo</h4>
                <div class="val" style="color:#4ade80;">$${balEf.toLocaleString()}</div>
            </div>
            <div class="balance-item">
                <h4>Transferencia</h4>
                <div class="val" style="color:#a78bfa;">$${balTr.toLocaleString()}</div>
            </div>
        `;

        window.listaBarberos.forEach(b => {
            const bKey = b.toLowerCase();
            balGrid.innerHTML += `
                <div class="balance-item">
                    <h4>${b}</h4>
                    <div class="val">$${(balBarberos[bKey] || 0).toLocaleString()}</div>
                </div>
            `;
        });
    };

    window.switchTab = function(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if (tabName === 'diario') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-diario').classList.add('active');
            actualizarInterfazDiaria();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-historial').classList.add('active');
            renderHistorial();
        }
    };

    window.abrirModalBarberos = function() {
        renderListaModalBarberos();
        document.getElementById('modalBarberos').style.display = 'flex';
    };

    window.cerrarModalBarberos = function() {
        document.getElementById('modalBarberos').style.display = 'none';
    };

    window.renderListaModalBarberos = function() {
        const contenedor = document.getElementById('listaBarberosEdit');
        contenedor.innerHTML = '';
        window.listaBarberos.forEach((b, idx) => {
            contenedor.innerHTML += `
                <div class="barber-item-edit">
                    <input type="text" value="${b}" readonly>
                    <button class="btn-delete" style="width:auto;" onclick="eliminarBarbero(${idx})">✕</button>
                </div>
            `;
        });
    };

    window.agregarBarberoNuevo = async function() {
        const val = document.getElementById('nuevoBarberoNombre').value.trim();
        if (val) {
            window.listaBarberos.push(val.toLowerCase());
            await setDoc(doc(db, "configuracion", "barberos"), { lista: window.listaBarberos });
            document.getElementById('nuevoBarberoNombre').value = '';
            renderListaModalBarberos();
        }
    };

    window.eliminarBarbero = async function(idx) {
        if (window.listaBarberos.length <= 1) {
            alert('Debe existir al menos un barbero.');
            return;
        }
        if (confirm(`¿Eliminar a ${window.listaBarberos[idx]}?`)) {
            window.listaBarberos.splice(idx, 1);
            await setDoc(doc(db, "configuracion", "barberos"), { lista: window.listaBarberos });
            renderListaModalBarberos();
        }
    };

    window.activarPersonalizado = function() { document.getElementById('filtroTiempo').value = 'personalizado'; };
    window.limpiarFechasManuales = function() { document.getElementById('fechaDesde').value = ''; document.getElementById('fechaHasta').value = ''; };
</script>
</body>
</html>
