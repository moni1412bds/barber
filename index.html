<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Barbería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 30px;
    }
    .status-header {
      background-color: #111827;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }
    .main-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0f0f0;
      margin-bottom: 20px;
    }
    .barbero-card {
      border-radius: 12px;
      padding: 15px;
      color: white;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    .badge-transf {
      background-color: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      font-weight: 600;
      padding: 5px 10px;
    }
    .badge-efec {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
      font-weight: 600;
      padding: 5px 10px;
    }
    .nav-tabs .nav-link {
      color: #4b5563;
      font-weight: 600;
      border: none;
      padding: 10px 20px;
    }
    .nav-tabs .nav-link.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
      background: transparent;
    }
  </style>
</head>
<body>

  <!-- Estado de Sincronización -->
  <div class="status-header">
    <span id="statusText">Cargando...</span>
  </div>

  <div class="container my-3" style="max-width: 600px;">
    
    <!-- Navegación -->
    <ul class="nav nav-tabs justify-content-center mb-3" id="mainTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="tab-registro-link" data-bs-toggle="tab" data-bs-target="#tab-registro" type="button">Cortes de Hoy</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-historial-link" data-bs-toggle="tab" data-bs-target="#tab-historial" type="button" onclick="renderHistorial()">Historial de Cierres</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-opciones-link" data-bs-toggle="tab" data-bs-target="#tab-opciones" type="button">⚙️ Opciones</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabsContent">
      
      <!-- PESTAÑA CORTES -->
      <div class="tab-pane fade show active" id="tab-registro" role="tabpanel">
        
        <!-- Tarjetas Barberos -->
        <div id="barberosCards" class="row g-2 mb-3"></div>

        <!-- Formulario Agregar Corte -->
        <div class="main-card">
          <div class="row g-2 align-items-center">
            <div class="col-6">
              <label class="form-label small text-muted mb-1 fw-bold">Peluquero</label>
              <select id="selectBarbero" class="form-select form-select-lg fs-6"></select>
            </div>
            <div class="col-6">
              <label class="form-label small text-muted mb-1 fw-bold">Monto ($)</label>
              <input type="number" id="montoCorte" class="form-control form-control-lg fs-6" value="10000" step="500">
            </div>
            <div class="col-6 mt-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkTransferencia">
                <label class="form-check-label fw-bold small" for="checkTransferencia">
                  💳 Transferencia
                </label>
              </div>
            </div>
            <div class="col-6 mt-3">
              <button class="btn btn-dark w-100 fw-bold py-2" onclick="registrarCorte()">+ Registrar Corte</button>
            </div>
          </div>
        </div>

        <!-- Tabla -->
        <div class="d-flex justify-content-between align-items-center mb-2 px-1">
          <h5 class="fw-bold m-0 text-secondary">Cortes del Día</h5>
          <button class="btn btn-danger btn-sm fw-bold px-3 rounded-pill" onclick="realizarCierreDiario()">🔒 Realizar Cierre Diario</button>
        </div>

        <div class="main-card p-0 overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-center">
              <thead class="bg-light text-muted small">
                <tr>
                  <th>Hora</th>
                  <th>Peluquero</th>
                  <th>Medio</th>
                  <th>Monto Corte</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tablaCortesBody"></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- PESTAÑA HISTORIAL -->
      <div class="tab-pane fade" id="tab-historial" role="tabpanel">
        <h5 class="fw-bold mb-3 text-secondary">Historial de Cierres Diarios</h5>
        <div id="historialContainer"></div>
      </div>

      <!-- PESTAÑA OPCIONES -->
      <div class="tab-pane fade" id="tab-opciones" role="tabpanel">
        <div class="main-card">
          <h6 class="fw-bold mb-3">Gestión de Barberos</h6>
          <div class="input-group mb-3">
            <input type="text" id="nuevoBarberoNombre" class="form-control" placeholder="Nombre peluquero">
            <button class="btn btn-primary fw-bold" onclick="agregarBarbero()">Agregar</button>
          </div>
          <ul id="listaBarberosUl" class="list-group list-group-flush"></ul>
        </div>

        <div class="main-card">
          <h6 class="fw-bold mb-3">Credenciales JSONBin</h6>
          <div class="mb-2">
            <label class="form-label small text-muted mb-1">BIN ID</label>
            <input type="text" id="inputBinId" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted mb-1">Master Key</label>
            <input type="password" id="inputMasterKey" class="form-control">
          </div>
          <button class="btn btn-secondary w-100 fw-bold" onclick="guardarConfiguracion()">Guardar Credenciales</button>
        </div>

        <div class="main-card border-danger">
          <h6 class="fw-bold text-danger mb-2">Zona de Mantenimiento</h6>
          <p class="text-muted small mb-3">Si tenés registros viejos que no se borran, forzá el reseteo de la lista de hoy.</p>
          <button class="btn btn-outline-danger w-100 fw-bold" onclick="forzarLimpiezaLocal()">🚨 Limpiar Registro de Hoy ($0)</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let BIN_ID = localStorage.getItem('BIN_ID') || '';
    let MASTER_KEY = localStorage.getItem('MASTER_KEY') || '';

    let listaBarberos = JSON.parse(localStorage.getItem('listaBarberos')) || ['Riki', 'Lucas', 'Willy'];
    let registrosHoy = JSON.parse(localStorage.getItem('registrosHoy')) || [];
    let historialCierres = JSON.parse(localStorage.getItem('historialCierres')) || [];

    const coloresBarberos = ['#f59e0b', '#8b5cf6', '#3b82f6', '#10b981', '#ec4899', '#14b8a6'];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputBinId').value = BIN_ID;
      document.getElementById('inputMasterKey').value = MASTER_KEY;
      
      actualizarSelectoresBarberos();
      actualizarInterfazDiaria();
      
      if (BIN_ID && MASTER_KEY) {
        sincronizarConNube();
      } else {
        document.getElementById('statusText').innerText = 'Modo Local (Sin credenciales)';
      }
    });

    function guardarLocal() {
      localStorage.setItem('registrosHoy', JSON.stringify(registrosHoy));
      localStorage.setItem('historialCierres', JSON.stringify(historialCierres));
      localStorage.setItem('listaBarberos', JSON.stringify(listaBarberos));
    }

    // Normalizador de datos para evitar "undefined"
    function normalizarCorte(c) {
      return {
        id: c.id || Date.now(),
        hora: c.hora || '12:00 p. m.',
        barbero: c.barbero || c.peluquero || c.Peluquero || 'Desconocido',
        medio: c.medio || c.metodo || c.Medio || (c.transferencia ? 'Transf.' : 'Efec.'),
        monto: parseFloat(c.monto || c.Monto || c.montoCorte || 0)
      };
    }

    async function sincronizarConNube(limpiarHoy = false) {
      const elemStatus = document.getElementById('statusText');
      if (elemStatus) elemStatus.innerText = 'Sincronizando...';

      if (!BIN_ID || !MASTER_KEY) {
        if (elemStatus) elemStatus.innerText = 'Sin credenciales configuradas';
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        
        if (!res.ok) throw new Error('Error al conectar');

        const data = await res.json();
        const rec = data.record || {};

        let nubeHoy = (rec.registrosHoy || rec.cortes || []).map(normalizarCorte);
        let nubeHistorial = rec.historialCierres || rec.historial || [];
        let nubeBarberos = rec.listaBarberos || rec.barberos || [];

        if (limpiarHoy) {
          registrosHoy = [];
        } else {
          registrosHoy = nubeHoy;
        }

        if (nubeHistorial.length > 0) {
          historialCierres = nubeHistorial;
        }

        if (nubeBarberos.length > 0) {
          // Normalizar nombres a Mayúscula Inicial
          const unicos = new Set();
          nubeBarberos.forEach(b => {
            if (b) {
              const nombreLimpio = b.trim().charAt(0).toUpperCase() + b.trim().slice(1).toLowerCase();
              unicos.add(nombreLimpio);
            }
          });
          listaBarberos = Array.from(unicos);
        }

        // Guardar actualización en la nube
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({
            registrosHoy: registrosHoy,
            historialCierres: historialCierres,
            listaBarberos: listaBarberos
          })
        });

        guardarLocal();
        actualizarSelectoresBarberos();
        actualizarInterfazDiaria();
        
        if (elemStatus) elemStatus.innerText = 'Estado: Sincronizado ✅';

      } catch (err) {
        console.error(err);
        if (elemStatus) elemStatus.innerText = 'Error de conexión / Guardado local';
      }
    }

    function registrarCorte() {
      const barbero = document.getElementById('selectBarbero').value;
      const monto = parseFloat(document.getElementById('montoCorte').value) || 0;
      const esTransferencia = document.getElementById('checkTransferencia').checked;

      if (!barbero || monto <= 0) {
        alert('Ingresá un monto válido.');
        return;
      }

      const nuevoCorte = {
        id: Date.now(),
        hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
        barbero: barbero,
        medio: esTransferencia ? 'Transf.' : 'Efec.',
        monto: monto
      };

      registrosHoy.push(nuevoCorte);
      document.getElementById('checkTransferencia').checked = false;

      guardarLocal();
      actualizarInterfazDiaria();
      sincronizarConNube();
    }

    function eliminarCorte(id) {
      if (confirm('¿Eliminar este corte?')) {
        registrosHoy = registrosHoy.filter(c => c.id !== id);
        guardarLocal();
        actualizarInterfazDiaria();
        sincronizarConNube();
      }
    }

    function realizarCierreDiario() {
      if (registrosHoy.length === 0) {
        alert('No hay cortes para cerrar.');
        return;
      }

      if (confirm('¿Hacer Cierre Diario? Se borrarán los cortes de hoy y pasarán al Historial.')) {
        const fechaHoy = new Date().toLocaleDateString('es-AR');
        
        const resumenCierre = {
          fecha: fechaHoy,
          cierreHora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
          cortes: [...registrosHoy]
        };

        historialCierres.unshift(resumenCierre);
        registrosHoy = [];

        guardarLocal();
        actualizarInterfazDiaria();
        sincronizarConNube(true);
        alert('Cierre registrado correctamente.');
      }
    }

    function actualizarInterfazDiaria() {
      // 1. Tarjetas
      const barberosCardsContainer = document.getElementById('barberosCards');
      barberosCardsContainer.innerHTML = '';

      listaBarberos.forEach((barbero, idx) => {
        const cortesBarbero = registrosHoy.filter(c => c.barbero.toLowerCase() === barbero.toLowerCase());
        const cantCortes = cortesBarbero.length;
        const totalEfec = cortesBarbero.filter(c => c.medio.includes('Efe') || c.medio === 'Efec.').reduce((sum, c) => sum + c.monto, 0);
        const totalTransf = cortesBarbero.filter(c => c.medio.includes('Tra') || c.medio === 'Transf.').reduce((sum, c) => sum + c.monto, 0);
        const totalGeneral = totalEfec + totalTransf;

        const colorBg = coloresBarberos[idx % coloresBarberos.length];

        const cardHTML = `
          <div class="col-4">
            <div class="barbero-card" style="background-color: ${colorBg};">
              <div class="fs-6 fw-bold mb-1">${barbero}</div>
              <div class="fs-4 fw-bolder">$${totalGeneral.toLocaleString()}</div>
              <div class="small fw-normal mb-1">${cantCortes} cortes</div>
              <div style="font-size: 0.7rem; opacity: 0.9;">Ef: $${totalEfec.toLocaleString()} | Tr: $${totalTransf.toLocaleString()}</div>
            </div>
          </div>
        `;
        barberosCardsContainer.innerHTML += cardHTML;
      });

      // 2. Tabla
      const tablaBody = document.getElementById('tablaCortesBody');
      tablaBody.innerHTML = '';

      if (registrosHoy.length === 0) {
        tablaBody.innerHTML = '<tr><td colspan="5" class="text-muted py-3">No hay cortes registrados hoy</td></tr>';
        return;
      }

      registrosHoy.forEach(c => {
        const esTransf = c.medio.includes('Tra') || c.medio === 'Transf.';
        const badgeClass = esTransf ? 'badge-transf' : 'badge-efec';
        const icono = esTransf ? '💳' : '💵';

        const row = `
          <tr>
            <td>${c.hora}</td>
            <td class="fw-bold">${c.barbero}</td>
            <td><span class="badge ${badgeClass}">${icono} ${c.medio}</span></td>
            <td class="fw-bold">$${c.monto.toLocaleString()}</td>
            <td>
              <button class="btn btn-sm btn-outline-danger border-0 fw-bold" onclick="eliminarCorte(${c.id})">✕</button>
            </td>
          </tr>
        `;
        tablaBody.innerHTML += row;
      });
    }

    function renderHistorial() {
      const container = document.getElementById('historialContainer');
      container.innerHTML = '';

      if (!historialCierres || historialCierres.length === 0) {
        container.innerHTML = '<div class="main-card text-muted text-center py-4">No hay cierres guardados en el historial.</div>';
        return;
      }

      historialCierres.forEach(cierre => {
        const cortesCierre = (cierre.cortes || cierre.registros || []).map(normalizarCorte);
        const totalDia = cortesCierre.reduce((sum, c) => sum + c.monto, 0);

        let detalleHTML = '';
        cortesCierre.forEach(c => {
          detalleHTML += `
            <li class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-bottom">
              <small class="text-secondary">${c.hora} - <strong>${c.barbero}</strong> (${c.medio})</small>
              <small class="fw-bold">$${c.monto.toLocaleString()}</small>
            </li>
          `;
        });

        const card = `
          <div class="main-card mb-3">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
              <div>
                <h6 class="fw-bold m-0">📅 ${cierre.fecha || 'Sin Fecha'}</h6>
                <small class="text-muted">Cierre: ${cierre.cierreHora || ''}</small>
              </div>
              <span class="badge bg-success fs-6 px-3 py-2">$${totalDia.toLocaleString()}</span>
            </div>
            <ul class="list-group list-group-flush mb-0">
              ${detalleHTML}
            </ul>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function actualizarSelectoresBarberos() {
      const select = document.getElementById('selectBarbero');
      const listaUl = document.getElementById('listaBarberosUl');
      
      select.innerHTML = '';
      listaUl.innerHTML = '';

      listaBarberos.forEach(b => {
        select.innerHTML += `<option value="${b}">${b}</option>`;
        listaUl.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center py-2 px-0">
            <span class="fw-bold">${b}</span>
            <button class="btn btn-sm btn-outline-danger" onclick="eliminarBarbero('${b}')">Borrar</button>
          </li>
        `;
      });
    }

    function agregarBarbero() {
      const input = document.getElementById('nuevoBarberoNombre');
      const nombre = input.value.trim();
      if (nombre) {
        const nombreFormateado = nombre.charAt(0).toUpperCase() + nombre.slice(1).toLowerCase();
        if (!listaBarberos.includes(nombreFormateado)) {
          listaBarberos.push(nombreFormateado);
          input.value = '';
          guardarLocal();
          actualizarSelectoresBarberos();
          actualizarInterfazDiaria();
          sincronizarConNube();
        }
      }
    }

    function eliminarBarbero(nombre) {
      if (listaBarberos.length <= 1) {
        alert('Debe quedar al menos un peluquero.');
        return;
      }
      listaBarberos = listaBarberos.filter(b => b.toLowerCase() !== nombre.toLowerCase());
      guardarLocal();
      actualizarSelectoresBarberos();
      actualizarInterfazDiaria();
      sincronizarConNube();
    }

    function guardarConfiguracion() {
      BIN_ID = document.getElementById('inputBinId').value.trim();
      MASTER_KEY = document.getElementById('inputMasterKey').value.trim();

      localStorage.setItem('BIN_ID', BIN_ID);
      localStorage.setItem('MASTER_KEY', MASTER_KEY);

      alert('Credenciales guardadas.');
      sincronizarConNube();
    }

    function forzarLimpiezaLocal() {
      if (confirm('¿Querés limpiar los cortes de hoy?')) {
        sincronizarConNube(true);
      }
    }
  </script>
</body>
</html>
