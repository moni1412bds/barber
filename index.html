<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Barbería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-bottom: 80px;
    }
    .card-custom {
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .status-bar {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .nav-tabs .nav-link.active {
      font-weight: bold;
      border-bottom: 3px solid #0d6efd;
    }
  </style>
</head>
<body>

  <!-- Barra de Estado -->
  <div class="bg-dark text-white text-center py-1 status-bar">
    Estado: <span id="statusText">Iniciando...</span>
  </div>

  <div class="container mt-3">
    <!-- Pestañas de Navegación -->
    <ul class="nav nav-tabs mb-3" id="mainTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="tab-registro-link" data-bs-toggle="tab" data-bs-target="#tab-registro" type="button">Cortes de Hoy</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-historial-link" data-bs-toggle="tab" data-bs-target="#tab-historial" type="button" onclick="renderHistorial()">Historial de Cierres</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-opciones-link" data-bs-toggle="tab" data-bs-target="#tab-opciones" type="button">⚙️ Opciones</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabsContent">
      
      <!-- PESTAÑA: REGISTRO Y CORTES DEL DÍA -->
      <div class="tab-pane fade show active" id="tab-registro" role="tabpanel">
        
        <!-- Tarjetas Resumen Barberos -->
        <div id="barberosCards" class="row g-2 mb-3">
          <!-- Se generan dinámicamente -->
        </div>

        <!-- Formulario para Registrar Corte -->
        <div class="card card-custom p-3 mb-3">
          <div class="row g-2 align-items-center">
            <div class="col-6 col-md-3">
              <label class="form-label mb-1 fw-bold">Peluquero</label>
              <select id="selectBarbero" class="form-select"></select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label mb-1 fw-bold">Monto ($)</label>
              <input type="number" id="montoCorte" class="form-control" value="10000" step="500">
            </div>
            <div class="col-6 col-md-3 d-flex align-items-end">
              <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="checkTransferencia">
                <label class="form-check-label fw-bold" for="checkTransferencia">
                  💳 Transferencia
                </label>
              </div>
            </div>
            <div class="col-6 col-md-3 d-flex align-items-end">
              <button class="btn btn-dark w-100 fw-bold" onclick="registrarCorte()">+ Registrar Corte</button>
            </div>
          </div>
        </div>

        <!-- Encabezado y Botón Cierre -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="m-0 fw-bold">Cortes del Día</h5>
          <button class="btn btn-danger btn-sm fw-bold" onclick="realizarCierreDiario()">🔒 Realizar Cierre Diario</button>
        </div>

        <!-- Tabla de Cortes del Día -->
        <div class="card card-custom p-2 table-responsive">
          <table class="table table-hover align-middle mb-0 text-center">
            <thead class="table-light">
              <tr>
                <th>Hora</th>
                <th>Peluquero</th>
                <th>Medio</th>
                <th>Monto Corte</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaCortesBody">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- PESTAÑA: HISTORIAL -->
      <div class="tab-pane fade" id="tab-historial" role="tabpanel">
        <h5 class="fw-bold mb-3">Historial de Cierres Diarios</h5>
        <div id="historialContainer">
          <!-- Tarjetas/Listas dinámicas de cierres -->
        </div>
      </div>

      <!-- PESTAÑA: OPCIONES -->
      <div class="tab-pane fade" id="tab-opciones" role="tabpanel">
        <div class="card card-custom p-3 mb-3">
          <h6 class="fw-bold">Gestión de Barberos</h6>
          <div class="input-group mb-2">
            <input type="text" id="nuevoBarberoNombre" class="form-control" placeholder="Nombre del Barbero">
            <button class="btn btn-primary" onclick="agregarBarbero()">Agregar</button>
          </div>
          <ul id="listaBarberosUl" class="list-group"></ul>
        </div>

        <div class="card card-custom p-3 mb-3">
          <h6 class="fw-bold">Credenciales JSONBin</h6>
          <div class="mb-2">
            <label class="form-label mb-1">BIN ID</label>
            <input type="text" id="inputBinId" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label mb-1">Master Key</label>
            <input type="password" id="inputMasterKey" class="form-control">
          </div>
          <button class="btn btn-secondary btn-sm" onclick="guardarConfiguracion()">Guardar Configuración</button>
        </div>

        <div class="card card-custom p-3 border-danger">
          <h6 class="fw-bold text-danger">Zona de Riesgo</h6>
          <p class="text-muted small">Usar esta opción solo si la app se trabó o muestra registros antiguos desfasados.</p>
          <button class="btn btn-outline-danger w-100 fw-bold" onclick="forzarLimpiezaLocal()">🚨 Forzar Limpieza Diaria ($0)</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // --- VARIABLES DE ESTADO Y CONFIGURACIÓN ---
    let BIN_ID = localStorage.getItem('BIN_ID') || '';
    let MASTER_KEY = localStorage.getItem('MASTER_KEY') || '';

    let listaBarberos = JSON.parse(localStorage.getItem('listaBarberos')) || ['Riki', 'Lucas', 'Willy'];
    let registrosHoy = JSON.parse(localStorage.getItem('registrosHoy')) || [];
    let historialCierres = JSON.parse(localStorage.getItem('historialCierres')) || [];

    const coloresBarberos = ['#ffc107', '#6f42c1', '#0d6efd', '#198754', '#fd7e14', '#20c997'];

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputBinId').value = BIN_ID;
      document.getElementById('inputMasterKey').value = MASTER_KEY;
      
      actualizarSelectoresBarberos();
      actualizarInterfazDiaria();
      
      if (BIN_ID && MASTER_KEY) {
        sincronizarConNube();
      } else {
        document.getElementById('statusText').innerText = 'Modo Local (Sin JSONBin Configurado)';
      }
    });

    // --- ALMACENAMIENTO LOCAL ---
    function guardarLocal() {
      localStorage.setItem('registrosHoy', JSON.stringify(registrosHoy));
      localStorage.setItem('historialCierres', JSON.stringify(historialCierres));
      localStorage.setItem('listaBarberos', JSON.stringify(listaBarberos));
    }

    // --- SINCRONIZACIÓN CON JSONBIN (LÓGICA CORREGIDA) ---
    async function sincronizarConNube(forzarLimpiezaLocal = false) {
      const elemStatus = document.getElementById('statusText');
      if (elemStatus) elemStatus.innerText = 'Sincronizando...';

      if (!BIN_ID || !MASTER_KEY) {
        if (elemStatus) elemStatus.innerText = 'Modo Local (Sin credenciales de nube)';
        return;
      }

      if (!navigator.onLine) {
        if (elemStatus) elemStatus.innerText = 'Sin Conexión (Modo Offline) 📡❌';
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        
        if (!res.ok) throw new Error('Error al conectar con JSONBin');

        const data = await res.json();
        let nubeHoy = data.record.registrosHoy || [];
        let nubeHistorial = data.record.historialCierres || [];
        let nubeBarberos = data.record.listaBarberos || listaBarberos;

        if (forzarLimpiezaLocal) {
          nubeHoy = [];
          registrosHoy = [];
        } else {
          // LÓGICA CORREGIDA: Si en la nube hay menos cortes o está vacía (por cierre previo), 
          // prevalece siempre el estado de la nube para no restaurar registros antiguos.
          registrosHoy = nubeHoy;
        }

        if (nubeHistorial.length >= historialCierres.length) {
          historialCierres = nubeHistorial;
        }

        listaBarberos = Array.from(new Set([...listaBarberos, ...nubeBarberos]));

        // Guardar estado unificado en JSONBin
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({
            registrosHoy: registrosHoy,
            historialCierres: historialCierres,
            listaBarberos: listaBarberos
          })
        });

        guardarLocal();
        actualizarSelectoresBarberos();
        actualizarInterfazDiaria();
        
        if (document.getElementById('tab-historial').classList.contains('active')) {
          renderHistorial();
        }

        if (elemStatus) elemStatus.innerText = 'Sincronizado ✅ (v1.1.0)';

      } catch (err) {
        console.error(err);
        if (elemStatus) elemStatus.innerText = 'Guardado solo Local (Offline / Error de Red) ⚠️';
      }
    }

    // --- ACCIONES DE CORTES ---
    function registrarCorte() {
      const barbero = document.getElementById('selectBarbero').value;
      const monto = parseFloat(document.getElementById('montoCorte').value) || 0;
      const esTransferencia = document.getElementById('checkTransferencia').checked;

      if (!barbero || monto <= 0) {
        alert('Por favor ingrese un monto válido.');
        return;
      }

      const nuevoCorte = {
        id: Date.now(),
        hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
        barbero: barbero,
        medio: esTransferencia ? 'Transf.' : 'Efec.',
        monto: monto
      };

      registrosHoy.push(nuevoCorte);
      document.getElementById('checkTransferencia').checked = false;

      guardarLocal();
      actualizarInterfazDiaria();
      sincronizarConNube();
    }

    function eliminarCorte(id) {
      if (confirm('¿Seguro que querés eliminar este corte?')) {
        registrosHoy = registrosHoy.filter(corte => corte.id !== id);
        guardarLocal();
        actualizarInterfazDiaria();
        sincronizarConNube();
      }
    }

    function realizarCierreDiario() {
      if (registrosHoy.length === 0) {
        alert('No hay cortes registrados hoy.');
        return;
      }

      if (confirm('¿Confirmás realizar el Cierre Diario? Se guardará en el historial y se limpiará el registro de hoy.')) {
        const fechaHoy = new Date().toLocaleDateString('es-AR');
        
        const resumenCierre = {
          fecha: fechaHoy,
          cierreHora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
          cortes: [...registrosHoy]
        };

        historialCierres.unshift(resumenCierre);
        registrosHoy = [];

        guardarLocal();
        actualizarInterfazDiaria();
        sincronizarConNube(true);
        alert('Cierre realizado con éxito.');
      }
    }

    // --- RENDERING E INTERFAZ ---
    function actualizarInterfazDiaria() {
      // 1. Tarjetas Resumen Barberos
      const barberosCardsContainer = document.getElementById('barberosCards');
      barberosCardsContainer.innerHTML = '';

      listaBarberos.forEach((barbero, idx) => {
        const cortesBarbero = registrosHoy.filter(c => c.barbero === barbero);
        const cantCortes = cortesBarbero.length;
        const totalEfec = cortesBarbero.filter(c => c.medio === 'Efec.').reduce((sum, c) => sum + c.monto, 0);
        const totalTransf = cortesBarbero.filter(c => c.medio === 'Transf.').reduce((sum, c) => sum + c.monto, 0);
        const totalGeneral = totalEfec + totalTransf;

        const colorBg = coloresBarberos[idx % coloresBarberos.length];

        const cardHTML = `
          <div class="col-6 col-md-4">
            <div class="card p-2 text-white shadow-sm text-center" style="background-color: ${colorBg}; border-radius: 10px;">
              <h6 class="mb-0 fw-bold">${barbero}</h6>
              <h4 class="fw-bold my-1">$${totalGeneral.toLocaleString()}</h4>
              <small class="d-block">${cantCortes} cortes</small>
              <small class="d-block style="font-size: 0.75rem;">Ef: $${totalEfec.toLocaleString()} | Tr: $${totalTransf.toLocaleString()}</small>
            </div>
          </div>
        `;
        barberosCardsContainer.innerHTML += cardHTML;
      });

      // 2. Tabla Cortes
      const tablaBody = document.getElementById('tablaCortesBody');
      tablaBody.innerHTML = '';

      if (registrosHoy.length === 0) {
        tablaBody.innerHTML = '<tr><td colspan="5" class="text-muted">No hay cortes registrados hoy</td></tr>';
        return;
      }

      registrosHoy.forEach(c => {
        const badgeClass = c.medio === 'Transf.' ? 'bg-primary-subtle text-primary border border-primary' : 'bg-success-subtle text-success border border-success';
        const icono = c.medio === 'Transf.' ? '💳' : '💵';

        const row = `
          <tr>
            <td>${c.hora}</td>
            <td class="fw-bold">${c.barbero}</td>
            <td><span class="badge ${badgeClass}">${icono} ${c.medio}</span></td>
            <td class="fw-bold">$${c.monto.toLocaleString()}</td>
            <td>
              <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="eliminarCorte(${c.id})">✕</button>
            </td>
          </tr>
        `;
        tablaBody.innerHTML += row;
      });
    }

    function renderHistorial() {
      const container = document.getElementById('historialContainer');
      container.innerHTML = '';

      if (historialCierres.length === 0) {
        container.innerHTML = '<p class="text-muted">No hay cierres guardados en el historial.</p>';
        return;
      }

      historialCierres.forEach((cierre, index) => {
        const totalDia = cierre.cortes.reduce((sum, c) => sum + c.monto, 0);
        
        let detalleHTML = '';
        cierre.cortes.forEach(c => {
          detalleHTML += `
            <li class="list-group-item d-flex justify-content-between align-items-center py-1">
              <small>${c.hora} - <strong>${c.barbero}</strong> (${c.medio})</small>
              <small class="fw-bold">$${c.monto.toLocaleString()}</small>
            </li>
          `;
        });

        const card = `
          <div class="card card-custom p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold m-0">📅 ${cierre.fecha} (Cierre: ${cierre.cierreHora})</h6>
              <span class="badge bg-success fs-6">$${totalDia.toLocaleString()}</span>
            </div>
            <ul class="list-group list-group-flush mb-0">
              ${detalleHTML}
            </ul>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function actualizarSelectoresBarberos() {
      const select = document.getElementById('selectBarbero');
      const listaUl = document.getElementById('listaBarberosUl');
      
      select.innerHTML = '';
      listaUl.innerHTML = '';

      listaBarberos.forEach(b => {
        select.innerHTML += `<option value="${b}">${b}</option>`;
        listaUl.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center py-1">
            ${b}
            <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="eliminarBarbero('${b}')">✕</button>
          </li>
        `;
      });
    }

    // --- OPCIONES Y GESTIÓN DE BARBEROS ---
    function agregarBarbero() {
      const input = document.getElementById('nuevoBarberoNombre');
      const nombre = input.value.trim();
      if (nombre && !listaBarberos.includes(nombre)) {
        listaBarberos.push(nombre);
        input.value = '';
        guardarLocal();
        actualizarSelectoresBarberos();
        actualizarInterfazDiaria();
        sincronizarConNube();
      }
    }

    function eliminarBarbero(nombre) {
      if (listaBarberos.length <= 1) {
        alert('Debe haber al menos un barbero.');
        return;
      }
      listaBarberos = listaBarberos.filter(b => b !== nombre);
      guardarLocal();
      actualizarSelectoresBarberos();
      actualizarInterfazDiaria();
      sincronizarConNube();
    }

    function guardarConfiguracion() {
      BIN_ID = document.getElementById('inputBinId').value.trim();
      MASTER_KEY = document.getElementById('inputMasterKey').value.trim();

      localStorage.setItem('BIN_ID', BIN_ID);
      localStorage.setItem('MASTER_KEY', MASTER_KEY);

      alert('Configuración guardada.');
      sincronizarConNube();
    }

    function forzarLimpiezaLocal() {
      if (confirm('¿Quieres resetear la lista de hoy a $0? Esto corregirá los desfases.')) {
        sincronizarConNube(true);
      }
    }
  </script>
</body>
</html>
