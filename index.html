<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Barbería - Profesional</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent-card: #0ea5e9;
            --bg: #f1f5f9;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #334155;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .header { flex-direction: row; justify-content: space-between; align-items: center; }
            body { padding: 15px; }
            .container { padding: 20px; }
        }

        h1 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        .date-badge { background: #e2e8f0; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; align-self: flex-start; }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: #e2e8f0;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #64748b;
            transition: 0.2s;
            font-size: 0.85rem;
            text-align: center;
        }

        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .card {
            padding: 12px;
            border-radius: 10px;
            color: white;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            background-color: #3b82f6;
        }

        .card-total { background-color: #1e293b; }
        .card h3 { margin: 0 0 6px 0; font-size: 1rem; text-transform: capitalize; }
        .card .amount { font-size: 1.3rem; font-weight: bold; }
        .card .subtext { font-size: 0.78rem; opacity: 0.95; margin-top: 4px; line-height: 1.3; }

        .input-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
        label { font-weight: 600; font-size: 0.8rem; }

        select, input, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            min-width: 150px;
            user-select: none;
        }

        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { cursor: pointer; font-size: 0.85rem; margin: 0; }

        button.btn-primary { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button.btn-close-day { background-color: #ef4444; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; width: auto; }
        button.btn-sync { background-color: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; }
        button.btn-update { background-color: #8b5cf6; color: white; border: none; cursor: pointer; font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; }
        button.btn-config { background-color: #475569; color: white; border: none; cursor: pointer; font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 550px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 10px; text-align: center; font-size: 0.85rem; white-space: nowrap; }
        th { background-color: #f8fafc; font-weight: bold; }

        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .btn-delete { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 4px 8px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.75rem;
            line-height: 1;
        }

        .btn-edit { 
            background: #f59e0b; 
            color: white; 
            border: none; 
            padding: 4px 8px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.75rem;
            line-height: 1;
        }

        .status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge-pago { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-efectivo { background: #dcfce7; color: #166534; }
        .badge-transf { background: #e0f2fe; color: #075985; }

        .balance-box { background: #1e293b; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
        .balance-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; text-align: center; }
        .balance-item h4 { margin: 0 0 4px 0; font-size: 0.8rem; opacity: 0.8; font-weight: normal; text-transform: capitalize; }
        .balance-item .val { font-size: 1.1rem; font-weight: bold; }

        .modal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999;
        }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 480px; }
        .barber-item-edit { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }

        @media print {
            .status-bar, .tabs, .input-section, .btn-close-day, .btn-delete, .btn-edit, .btn-config, .btn-sync, .btn-update { display: none !important; }
            .container { box-shadow: none; padding: 0; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✂️ Barbería - Control de Caja <span id="lblVersion" style="font-size:0.75rem; opacity:0.6;">v1.0.0</span></h1>
        <div class="date-badge" id="fechaHoy">--/--/----</div>
    </div>

    <!-- BARRA DE ESTADO Y HERRAMIENTAS -->
    <div class="status-bar" id="statusBar">
        <div style="font-size: 0.85rem;">
            ☁️ <strong id="statusText">Cargando datos...</strong>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn-update" onclick="buscarActualizacion(true)">🚀 Actualizar App</button>
            <button class="btn-config" onclick="abrirModalBarberos()">⚙️ Opciones</button>
            <button class="btn-sync" onclick="sincronizarConNube()">🔄 Sincronizar</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('diario')">📆 Registro Diario</button>
        <button class="tab-btn" onclick="switchTab('historial')">📊 Historial Cierres</button>
    </div>

    <!-- PESTAÑA 1: REGISTRO DIARIO -->
    <div id="tab-diario" class="tab-content active">
        <div class="cards-grid" id="cardsBarberosGrid"></div>

        <div class="input-section">
            <div class="input-group">
                <label for="peluquero">Peluquero</label>
                <select id="peluquero"></select>
            </div>
            <div class="input-group">
                <label for="monto">Monto ($)</label>
                <input type="number" id="monto" value="10000" step="1000">
            </div>
            <div class="checkbox-group" onclick="document.getElementById('esTransferencia').click(); event.stopPropagation();">
                <input type="checkbox" id="esTransferencia" onclick="event.stopPropagation();">
                <label for="esTransferencia">💳 Transferencia</label>
            </div>
            <div class="input-group">
                <button class="btn-primary" id="btnAgregar" onclick="agregarOEditarCorte()">+ Registrar Corte</button>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; flex-wrap:wrap; gap:10px;">
            <h3 style="margin:0; font-size:1.1rem;">Cortes del Día</h3>
            <button class="btn-close-day" onclick="cierreDeCaja()">🔒 Realizar Cierre Diario</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Peluquero</th>
                        <th>Medio</th>
                        <th>Monto Corte</th>
                        <th>Pago Barbero</th>
                        <th>Estado Sync</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRegistrosDiarios"></tbody>
            </table>
        </div>
    </div>

    <!-- PESTAÑA 2: HISTORIAL Y RESUMEN -->
    <div id="tab-historial" class="tab-content">
        <div class="input-section" style="margin-bottom: 10px;">
            <div class="input-group">
                <label>Filtro Rápido</label>
                <select id="filtroTiempo" onchange="limpiarFechasManuales(); renderHistorial();">
                    <option value="semanal">Últimos 7 Días (Semanal)</option>
                    <option value="mensual">Último Mes (30 Días)</option>
                    <option value="todo">Histórico Completo</option>
                    <option value="personalizado">Rango Personalizado 📅</option>
                </select>
            </div>
            <div class="input-group">
                <label for="fechaDesde">Desde</label>
                <input type="date" id="fechaDesde" onchange="activarPersonalizado()">
            </div>
            <div class="input-group">
                <label for="fechaHasta">Hasta</label>
                <input type="date" id="fechaHasta" onchange="activarPersonalizado()">
            </div>
            <div class="input-group" style="min-width: 100px;">
                <label>&nbsp;</label>
                <button class="btn-primary" style="background:#0284c7;" onclick="renderHistorial()">🔍 Calcular</button>
            </div>
            <div class="input-group" style="min-width: 100px;">
                <label>&nbsp;</label>
                <button class="btn-primary" style="background:#475569;" onclick="window.print()">🖨️ Imprimir</button>
            </div>
        </div>

        <div class="balance-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; font-size:1.05rem;">📊 Balance del Período</h3>
                <span id="txtRangoFechas" style="font-size:0.8rem; opacity:0.8;">--</span>
            </div>
            <div class="balance-grid" id="balanceGrid"></div>
        </div>

        <div class="table-responsive">
            <table>
                <thead id="headHistorial"></thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL CONFIGURACIÓN -->
<div class="modal-bg" id="modalBarberos">
    <div class="modal-content">
        <h3 style="margin-top:0;">⚙️ Configurar Barberos</h3>
        <p style="font-size:0.85rem; color:#64748b;">Añade, renombra o elimina miembros del equipo:</p>
        
        <div id="listaBarberosEdit" style="max-height:180px; overflow-y:auto; margin-bottom:15px;"></div>

        <div style="display:flex; gap:6px; margin-bottom:15px;">
            <input type="text" id="nuevoBarberoNombre" placeholder="Nombre nuevo barbero...">
            <button class="btn-primary" style="width:auto;" onclick="agregarBarberoNuevo()">+ Añadir</button>
        </div>

        <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">

        <h4 style="margin:0 0 8px 0; font-size:0.9rem;">💾 Copia de Seguridad y Mantenimiento</h4>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn-primary" style="background:#0284c7; font-size:0.8rem;" onclick="exportarBackup()">📥 Descargar Backup</button>
            <button class="btn-primary" style="background:#475569; font-size:0.8rem;" onclick="document.getElementById('inputImport').click()">📤 Cargar Backup</button>
            <input type="file" id="inputImport" accept=".json" style="display:none;" onchange="importarBackup(event)">
        </div>

        <div style="margin-top:15px; padding-top:10px; border-top:1px dashed #ef4444;">
            <button class="btn-primary" style="background:#dc2626; font-size:0.8rem; width:100%;" onclick="forzarLimpiezaDiaria()">🚨 Forzar Limpieza Diaria ($0)</button>
        </div>

        <div style="text-align:right; margin-top:20px;">
            <button onclick="cerrarModalBarberos()" class="btn-primary" style="width:auto; background:#1e293b;">Guardar y Cerrar</button>
        </div>
    </div>
</div>

<script>
    // CONFIGURACIÓN DE VERSIÓN Y SERVIDOR DE ACTUALIZACIONES
    const APP_VERSION = "1.0.0"; // <-- Cambiá este valor en tu casa cuando hagas mejoras (ej. 1.0.1)
    const URL_ACTUALIZACION = "https://TU-USUARIO.github.io/TU-REPOSITORIO/index.html"; // <-- Reemplazá por tu URL online

    const BIN_ID = '6aad8afeffd5d160531714d0';
    const MASTER_KEY = '$2a$10$FCxMjtRnqqHPzGwm9sQLP.IwkeMvcgCSPwHRUd3yn4WR8Tc8LUJSa';

    let listaBarberos = ['riki', 'lucas', 'willy'];
    let registrosHoy = [];
    let historialCierres = [];
    let indiceEditando = -1;

    const coloresBarberos = ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

    document.getElementById('lblVersion').innerText = `v${APP_VERSION}`;
    document.getElementById('fechaHoy').innerText = new Date().toLocaleDateString('es-AR', {
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });

    function cargarLocal() {
        const localBarberos = localStorage.getItem('barber_lista');
        const localReg = localStorage.getItem('barber_registrosHoy');
        const localHist = localStorage.getItem('barber_historialCierres');
        
        if (localBarberos) listaBarberos = JSON.parse(localBarberos);
        if (localReg) registrosHoy = JSON.parse(localReg);
        if (localHist) historialCierres = JSON.parse(localHist);

        actualizarSelectoresBarberos();
    }

    function guardarLocal() {
        localStorage.setItem('barber_lista', JSON.stringify(listaBarberos));
        localStorage.setItem('barber_registrosHoy', JSON.stringify(registrosHoy));
        localStorage.setItem('barber_historialCierres', JSON.stringify(historialCierres));
    }

    function actualizarSelectoresBarberos() {
        const select = document.getElementById('peluquero');
        select.innerHTML = '';
        listaBarberos.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b.toLowerCase();
            opt.textContent = b.charAt(0).toUpperCase() + b.slice(1);
            select.appendChild(opt);
        });
    }

    // BUSCADOR Y DESCARGADOR DE ACTUALIZACIONES SCRIPT
    async function buscarActualizacion(manual = false) {
        if (!navigator.onLine) {
            if (manual) alert("No hay conexión a Internet para buscar actualizaciones.");
            return;
        }

        try {
            // Se le agrega timestamp para saltear el caché del navegador
            const res = await fetch(URL_ACTUALIZACION + '?nocache=' + new Date().getTime());
            if (!res.ok) throw new Error("No disponible");
            
            const htmlNuevo = await res.text();

            // Extraer la versión de la plantilla descargada
            const matchVersion = htmlNuevo.match(/const\s+APP_VERSION\s*=\s*["']([^"']+)["']/);
            const versionRemota = matchVersion ? matchVersion[1] : null;

            if (versionRemota && versionRemota !== APP_VERSION) {
                if (confirm(`🚀 ¡Hay una nueva versión de la app disponible (v${versionRemota})!\n¿Querés actualizar ahora? TUS DATOS NO SE PERDERÁN.`)) {
                    // Guardar datos por seguridad
                    guardarLocal();
                    
                    // Sobrescribir el archivo HTML en caliente y refrescar
                    document.open();
                    document.write(htmlNuevo);
                    document.close();
                }
            } else if (manual) {
                alert("Ya tenés la última versión instalada (v" + APP_VERSION + ").");
            }
        } catch (err) {
            if (manual) alert("No se pudo conectar con el servidor de actualizaciones.");
        }
    }

    async function sincronizarConNube(forzarLimpiezaLocal = false) {
        document.getElementById('statusText').innerText = 'Sincronizando...';
        
        if (!navigator.onLine) {
            document.getElementById('statusText').innerText = 'Sin Conexión (Modo Offline) 📡❌';
            return;
        }

        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            const data = await res.json();

            let nubeHoy = data.record.registrosHoy || [];
            let nubeHistorial = data.record.historialCierres || [];
            let nubeBarberos = data.record.listaBarberos || listaBarberos;

            if (forzarLimpiezaLocal) {
                nubeHoy = [];
                registrosHoy = [];
            } else {
                registrosHoy.forEach(r => r.sincronizado = true);
                if (registrosHoy.length >= nubeHoy.length) {
                    nubeHoy = registrosHoy;
                } else {
                    registrosHoy = nubeHoy;
                }
            }

            if (historialCierres.length > 0 || nubeHistorial.length === 0) {
                nubeHistorial = historialCierres;
            } else {
                historialCierres = nubeHistorial;
            }

            listaBarberos = Array.from(new Set([...listaBarberos, ...nubeBarberos]));

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({ 
                    registrosHoy: nubeHoy, 
                    historialCierres: nubeHistorial,
                    listaBarberos: listaBarberos
                })
            });

            guardarLocal();
            actualizarSelectoresBarberos();
            actualizarInterfazDiaria();
            
            if (document.getElementById('tab-historial').classList.contains('active')) {
                renderHistorial();
            }
            document.getElementById('statusText').innerText = 'Sincronizado ✅';

            // Al terminar la sincronización busca actualizaciones de forma silenciosa
            buscarActualizacion(false);

        } catch (err) {
            console.error(err);
            document.getElementById('statusText').innerText = 'Guardado solo Local (Offline) ⚠️';
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if (tabName === 'diario') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-diario').classList.add('active');
            actualizarInterfazDiaria();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-historial').classList.add('active');
            renderHistorial();
        }
    }

    async function agregarOEditarCorte() {
        const peluquero = document.getElementById('peluquero').value;
        const monto = parseFloat(document.getElementById('monto').value);
        const esTransferencia = document.getElementById('esTransferencia').checked;

        if (isNaN(monto) || monto <= 0) {
            alert('Ingrese un monto válido');
            return;
        }

        if (indiceEditando >= 0) {
            registrosHoy[indiceEditando].peluquero = peluquero;
            registrosHoy[indiceEditando].monto = monto;
            registrosHoy[indiceEditando].metodo = esTransferencia ? 'transferencia' : 'efectivo';
            registrosHoy[indiceEditando].sincronizado = false;

            indiceEditando = -1;
            document.getElementById('btnAgregar').innerText = '+ Registrar Corte';
            document.getElementById('btnAgregar').style.background = 'var(--primary)';
        } else {
            const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            registrosHoy.push({ 
                peluquero, 
                monto, 
                hora, 
                metodo: esTransferencia ? 'transferencia' : 'efectivo',
                sincronizado: false 
            });
        }

        document.getElementById('esTransferencia').checked = false;

        guardarLocal();
        actualizarInterfazDiaria();
        await sincronizarConNube();
    }

    function editarCorte(idx) {
        const reg = registrosHoy[idx];
        document.getElementById('peluquero').value = reg.peluquero;
        document.getElementById('monto').value = reg.monto;
        document.getElementById('esTransferencia').checked = (reg.metodo === 'transferencia');

        indiceEditando = idx;
        document.getElementById('btnAgregar').innerText = '✏️ Guardar Cambios';
        document.getElementById('btnAgregar').style.background = '#f59e0b';
    }

    async function eliminarCorte(idx) {
        registrosHoy.splice(idx, 1);
        guardarLocal();
        actualizarInterfazDiaria();
        await sincronizarConNube();
    }

    async function eliminarCierre(timestamp) {
        if (confirm('¿Eliminar este cierre del historial?')) {
            historialCierres = historialCierres.filter(c => c.timestamp !== timestamp);
            guardarLocal();
            renderHistorial();
            await sincronizarConNube();
        }
    }

    function actualizarInterfazDiaria() {
        const grid = document.getElementById('cardsBarberosGrid');
        grid.innerHTML = '';

        let totalCortes = registrosHoy.length;
        let totalRecaudado = registrosHoy.reduce((acc, curr) => acc + curr.monto, 0);
        let totalEf = registrosHoy.filter(r => (r.metodo || 'efectivo') === 'efectivo').reduce((acc, curr) => acc + curr.monto, 0);
        let totalTr = registrosHoy.filter(r => r.metodo === 'transferencia').reduce((acc, curr) => acc + curr.monto, 0);
        let ticketPromedio = totalCortes > 0 ? Math.round(totalRecaudado / totalCortes) : 0;

        grid.innerHTML += `
            <div class="card card-total">
                <h3>Total Hoy</h3>
                <div class="amount">$${totalRecaudado.toLocaleString()}</div>
                <div class="subtext">${totalCortes} cortes | Prom: $${ticketPromedio.toLocaleString()}<br>Ef: $${totalEf.toLocaleString()} | Tr: $${totalTr.toLocaleString()}</div>
            </div>
        `;

        listaBarberos.forEach((barbero, idx) => {
            const bKey = barbero.toLowerCase();
            const cortesB = registrosHoy.filter(r => r.peluquero === bKey);
            const efB = cortesB.filter(r => (r.metodo || 'efectivo') === 'efectivo').reduce((a, b) => a + b.monto, 0);
            const trB = cortesB.filter(r => r.metodo === 'transferencia').reduce((a, b) => a + b.monto, 0);
            const totB = efB + trB;
            const color = coloresBarberos[idx % coloresBarberos.length];

            grid.innerHTML += `
                <div class="card" style="background-color: ${color}">
                    <h3>${barbero}</h3>
                    <div class="amount">$${(totB * 0.5).toLocaleString()}</div>
                    <div class="subtext">${cortesB.length} cortes<br>Ef: $${(efB * 0.5).toLocaleString()} | Tr: $${(trB * 0.5).toLocaleString()}</div>
                </div>
            `;
        });

        const tbody = document.getElementById('tablaRegistrosDiarios');
        tbody.innerHTML = '';

        registrosHoy.forEach((reg, idx) => {
            const metodo = reg.metodo || 'efectivo';
            const iconSync = reg.sincronizado ? '☁️ Sincronizado' : '📱 Local (Pendiente)';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${reg.hora}</strong></td>
                <td style="text-transform: capitalize;">${reg.peluquero}</td>
                <td><span class="badge-pago ${metodo === 'transferencia' ? 'badge-transf' : 'badge-efectivo'}">${metodo === 'transferencia' ? '💳 Transf.' : '💵 Efec.'}</span></td>
                <td>$${reg.monto.toLocaleString()}</td>
                <td>$${(reg.monto * 0.5).toLocaleString()}</td>
                <td><span style="font-size:0.8rem;">${iconSync}</span></td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="editarCorte(${idx})">✏️</button>
                        <button class="btn-delete" onclick="eliminarCorte(${idx})">✕</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function cierreDeCaja() {
        if (registrosHoy.length === 0) {
            alert('No hay registros cargados para realizar el cierre.');
            return;
        }

        const fechaSugerida = new Date().toISOString().split('T')[0];
        const fechaIngresada = prompt("Confirma la FECHA para este cierre (AAAA-MM-DD):", fechaSugerida);

        if (!fechaIngresada) return;

        let detalleBarberos = {};
        listaBarberos.forEach(b => detalleBarberos[b.toLowerCase()] = 0);

        let efTotal = 0;
        let trTotal = 0;

        registrosHoy.forEach(r => {
            const m = r.metodo || 'efectivo';
            if (m === 'transferencia') trTotal += r.monto;
            else efTotal += r.monto;

            const bKey = r.peluquero.toLowerCase();
            if (detalleBarberos[bKey] !== undefined) {
                detalleBarberos[bKey] += (r.monto * 0.5);
            }
        });

        const partesFecha = fechaIngresada.split('-');
        const fechaFormateada = `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}`;

        const cierre = {
            fecha: fechaIngresada,
            fechaTexto: fechaFormateada,
            timestamp: new Date(fechaIngresada + 'T12:00:00').getTime(),
            cortesTotales: registrosHoy.length,
            recaudacionTotal: efTotal + trTotal,
            efectivoTotal: efTotal,
            transferenciaTotal: trTotal,
            pagosBarberos: detalleBarberos
        };

        historialCierres.push(cierre);
        registrosHoy = [];
        
        guardarLocal();
        actualizarInterfazDiaria();
        
        await sincronizarConNube(true);
        alert('✅ Cierre de caja realizado con éxito y caja diaria limpia.');
    }

    async function forzarLimpiezaDiaria() {
        if (confirm('🚨 ¿Estás seguro de que deseas forzar el borrado de la caja de hoy? Dejará los cortes diarios en $0 tanto localmente como en la nube.')) {
            registrosHoy = [];
            guardarLocal();
            actualizarInterfazDiaria();
            await sincronizarConNube(true);
            cerrarModalBarberos();
            alert('✅ Caja diaria reseteada a $0 de forma exitosa.');
        }
    }

    function activarPersonalizado() {
        document.getElementById('filtroTiempo').value = 'personalizado';
    }

    function limpiarFechasManuales() {
        document.getElementById('fechaDesde').value = '';
        document.getElementById('fechaHasta').value = '';
    }

    function renderHistorial() {
        const filtro = document.getElementById('filtroTiempo').value;
        const tbody = document.getElementById('tablaHistorial');
        const head = document.getElementById('headHistorial');
        tbody.innerHTML = '';

        let headHTML = `
            <tr>
                <th>Fecha Cierre</th>
                <th>Cortes</th>
                <th>Total General</th>
                <th>Efectivo</th>
                <th>Transferencias</th>
        `;
        listaBarberos.forEach(b => {
            headHTML += `<th style="text-transform:capitalize;">${b}</th>`;
        });
        headHTML += `<th>Acción</th></tr>`;
        head.innerHTML = headHTML;

        const ahora = new Date().getTime();
        let limiteMs = 0;

        let fechaDesdeVal = document.getElementById('fechaDesde').value;
        let fechaHastaVal = document.getElementById('fechaHasta').value;

        const filtrados = historialCierres.filter(c => {
            if (filtro === 'personalizado' && (fechaDesdeVal || fechaHastaVal)) {
                let cFecha = new Date(c.fecha + 'T00:00:00').getTime();
                let fDesde = fechaDesdeVal ? new Date(fechaDesdeVal + 'T00:00:00').getTime() : 0;
                let fHasta = fechaHastaVal ? new Date(fechaHastaVal + 'T23:59:59').getTime() : Infinity;

                return cFecha >= fDesde && cFecha <= fHasta;
            }

            if (filtro === 'semanal') limiteMs = 7 * 24 * 60 * 60 * 1000;
            else if (filtro === 'mensual') limiteMs = 30 * 24 * 60 * 60 * 1000;
            else if (filtro === 'todo') return true;

            return (ahora - c.timestamp) <= limiteMs;
        });

        filtrados.sort((a, b) => b.timestamp - a.timestamp);

        let balRecaudado = 0;
        let balCortes = 0;
        let balEf = 0;
        let balTr = 0;
        let balBarberos = {};
        listaBarberos.forEach(b => balBarberos[b.toLowerCase()] = 0);

        filtrados.forEach(c => {
            balRecaudado += (c.recaudacionTotal || 0);
            balCortes += (c.cortesTotales || 0);
            balEf += (c.efectivoTotal || 0);
            balTr += (c.transferenciaTotal || 0);

            let rowBarberosHTML = '';
            listaBarberos.forEach(b => {
                const bKey = b.toLowerCase();
                let val = 0;
                if (c.pagosBarberos && c.pagosBarberos[bKey] !== undefined) {
                    val = c.pagosBarberos[bKey];
                } else if (c[`${bKey}50`] !== undefined) {
                    val = c[`${bKey}50`];
                }
                balBarberos[bKey] += val;
                rowBarberosHTML += `<td>$${val.toLocaleString()}</td>`;
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${c.fechaTexto}</strong></td>
                <td>${c.cortesTotales}</td>
                <td><strong>$${c.recaudacionTotal.toLocaleString()}</strong></td>
                <td>$${(c.efectivoTotal || 0).toLocaleString()}</td>
                <td>$${(c.transferenciaTotal || 0).toLocaleString()}</td>
                ${rowBarberosHTML}
                <td><button class="btn-delete" onclick="eliminarCierre(${c.timestamp})">✕ Borrar</button></td>
            `;
            tbody.appendChild(tr);
        });

        const balGrid = document.getElementById('balanceGrid');
        balGrid.innerHTML = `
            <div class="balance-item">
                <h4>Total Recaudado</h4>
                <div class="val" style="color:#38bdf8;">$${balRecaudado.toLocaleString()}</div>
            </div>
            <div class="balance-item">
                <h4>Cortes Totales</h4>
                <div class="val">${balCortes}</div>
            </div>
            <div class="balance-item">
                <h4>Efectivo</h4>
                <div class="val" style="color:#4ade80;">$${balEf.toLocaleString()}</div>
            </div>
            <div class="balance-item">
                <h4>Transferencia</h4>
                <div class="val" style="color:#a78bfa;">$${balTr.toLocaleString()}</div>
            </div>
        `;

        listaBarberos.forEach(b => {
            const bKey = b.toLowerCase();
            balGrid.innerHTML += `
                <div class="balance-item">
                    <h4>${b}</h4>
                    <div class="val">$${(balBarberos[bKey] || 0).toLocaleString()}</div>
                </div>
            `;
        });

        if (filtro === 'personalizado' && (fechaDesdeVal || fechaHastaVal)) {
            document.getElementById('txtRangoFechas').innerText = `${fechaDesdeVal || 'Inicio'} a ${fechaHastaVal || 'Hoy'}`;
        } else if (filtro === 'semanal') {
            document.getElementById('txtRangoFechas').innerText = 'Últimos 7 Días';
        } else if (filtro === 'mensual') {
            document.getElementById('txtRangoFechas').innerText = 'Últimos 30 Días';
        } else {
            document.getElementById('txtRangoFechas').innerText = 'Histórico Completo';
        }
    }

    function abrirModalBarberos() {
        renderListaModalBarberos();
        document.getElementById('modalBarberos').style.display = 'flex';
    }

    function cerrarModalBarberos() {
        document.getElementById('modalBarberos').style.display = 'none';
        guardarLocal();
        actualizarSelectoresBarberos();
        actualizarInterfazDiaria();
        sincronizarConNube();
    }

    function renderListaModalBarberos() {
        const contenedor = document.getElementById('listaBarberosEdit');
        contenedor.innerHTML = '';

        listaBarberos.forEach((b, idx) => {
            contenedor.innerHTML += `
                <div class="barber-item-edit">
                    <input type="text" value="${b}" onchange="renombrarBarbero(${idx}, this.value)">
                    <button class="btn-delete" style="width:auto;" onclick="eliminarBarbero(${idx})">✕</button>
                </div>
            `;
        });
    }

    function agregarBarberoNuevo() {
        const val = document.getElementById('nuevoBarberoNombre').value.trim();
        if (val) {
            listaBarberos.push(val);
            document.getElementById('nuevoBarberoNombre').value = '';
            renderListaModalBarberos();
        }
    }

    function renombrarBarbero(idx, nuevoNombre) {
        if (nuevoNombre.trim()) listaBarberos[idx] = nuevoNombre.trim();
    }

    function eliminarBarbero(idx) {
        if (listaBarberos.length <= 1) {
            alert('Debe existir al menos un barbero.');
            return;
        }
        if (confirm(`¿Eliminar a ${listaBarberos[idx]}?`)) {
            listaBarberos.splice(idx, 1);
            renderListaModalBarberos();
        }
    }

    function exportarBackup() {
        const data = { listaBarberos, registrosHoy, historialCierres };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_barberia_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    function importarBackup(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const parsed = JSON.parse(evt.target.result);
                if (parsed.listaBarberos) listaBarberos = parsed.listaBarberos;
                if (parsed.registrosHoy) registrosHoy = parsed.registrosHoy;
                if (parsed.historialCierres) historialCierres = parsed.historialCierres;

                guardarLocal();
                actualizarSelectoresBarberos();
                actualizarInterfazDiaria();
                sincronizarConNube();
                alert('✅ Backup cargado con éxito.');
            } catch(err) {
                alert('❌ Archivo de copia de seguridad no válido.');
            }
        };
        reader.readAsText(file);
    }

    window.addEventListener('beforeunload', (e) => {
        const hayPendientes = registrosHoy.some(r => !r.sincronizado);
        if (hayPendientes) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    window.addEventListener('online', () => {
        sincronizarConNube();
    });

    cargarLocal();
    actualizarInterfazDiaria();
    sincronizarConNube();
</script>
